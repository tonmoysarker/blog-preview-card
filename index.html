<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Blog preview card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <a href="#" class="blog-link">
          <article class="blog-card">
            <img
              src="assets/images/illustration-article.svg"
              alt="blog cover photo"
              class="blog-card__image"
            />
            <div class="blog-card__content">
              <h3 class="blog-card__category">Learning</h3>
              <p class="blog-card__published-date">Published 21 Dec 2023</p>
              <h2 class="blog-card__title">HTML & CSS foundations</h2>
              <p class="blog-card__description">
                These languages are the backbone of every website, defining
                structure, content, and presentation.
              </p>
            </div>
            <div class="blog-card__author">
              <img
                src="assets/images/image-avatar.webp"
                alt="Author's avatar"
                class="blog-card__author-avatar"
              />
              <p class="blog-card__author-name">Greg Hooper</p>
            </div>
          </article>
        </a>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.frontendmentor.io/profile/tonmoysarker"
        >Tonmoy Sarker</a
      >.
    </footer>
  </body>
</html>
